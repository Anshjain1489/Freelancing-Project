name: Backend CI & Automated Audit

on:
  push:
    branches: [ main, production ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js 18.x
        uses: actions/setup-node@v3
        with:
          node-version: 18.x

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Diagnostic Environment Gate
        run: |
          echo "✓ Node.js runtime environment ready"
          echo "✓ Pre-deployment audit script initialized"

      - name: Run Environment & Security Check
        working-directory: ./backend
        env:
          NODE_ENV: production
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || vars.SUPABASE_SERVICE_ROLE_KEY }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET || vars.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET || vars.JWT_REFRESH_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
        run: node src/scripts/preDeploymentCheck.js
