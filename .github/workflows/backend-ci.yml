name: Backend CI & Automated Audit

on:
  push:
    branches: [ main, production ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js 18.x
        uses: actions/setup-node@v3
        with:
          node-version: 18.x

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Diagnostic Environment Gate
        run: |
          echo "✓ Node.js runtime environment ready"
          echo "✓ Pre-deployment audit script initialized"

      - name: Run Environment & Security Check
        working-directory: ./backend
        env:
          NODE_ENV: production
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://vuhwlckfhexlyezmfled.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ1aHdsY2tmaGV4bHllem1mbGVkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyODgxNTgsImV4cCI6MjEwMjg2NDE1OH0.94QQfa75xYoJQ5APORmT21ouAY5TBTIZhHu9JYrH-Ic' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ1aHdsY2tmaGV4bHllem1mbGVkIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NzI4ODE1OCwiZXhwIjoyMTAyODY0MTU4fQ.ovDLQX7wuL6o5MNKgl0IV8N_wAl1BZGA7fqPwW9bE_M' }}
